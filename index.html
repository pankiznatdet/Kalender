<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F1FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kalender">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Kalender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
:root{
  /* layout: variant switcher on top, one live phone screen below; each variant is its own single-theme world */
  --page:#131316; --page-fg:#F2F1EE; --page-mut:#A3A19A; --page-line:#2B2B30; --page-on:#F2F1EE; --page-on-ink:#131316;
  --f-ui:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--page-fg);font-family:var(--f-ui);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid currentColor;outline-offset:2px}

.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center}

/* ---------- phone shell (shared) ---------- */
.phone{position:relative;width:100%;max-width:430px;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font);transition:background .3s}
@media (min-width:600px) and (min-height:720px){
  .stage{padding:8px 16px 20px}
  .phone{height:min(860px,100%);border-radius:46px;border:1px solid var(--page-line);box-shadow:0 30px 80px rgba(0,0,0,.5)}
}
.phone *{box-sizing:border-box}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:26px 20px 128px;display:flex;flex-direction:column;gap:18px;scrollbar-width:none}
.scroll>*{flex:none}
.scroll::-webkit-scrollbar,.x::-webkit-scrollbar{display:none}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:8px}
.phone h1{margin:4px 0 0;font-size:30px;line-height:1.08;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
.phone h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.rbs{display:flex;gap:10px}
.rb{width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;position:relative;flex:none}
.rb .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:#FF6B5E;border:2px solid var(--bg)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 0 var(--acc);animation:pulse 1.8s infinite;flex:none}
.x{overflow-x:auto;scrollbar-width:none}

.fl{display:flex;gap:6px}
.fl button{height:44px;padding:0 15px;border-radius:999px;font-size:14px;font-weight:500;color:var(--mut);white-space:nowrap;border:1px solid var(--line);flex:none}
.fl button.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}

.list{display:flex;flex-direction:column;gap:10px}
.empty{margin:0;padding:22px;border:1px dashed var(--line);border-radius:22px;color:var(--mut);font-size:14px;text-align:center}
.ev{background:var(--card);border:1px solid var(--line);border-radius:24px;transition:transform .25s,box-shadow .25s,margin .25s}
.ev-h{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;position:relative;border-radius:inherit}
.ev-ic{flex:none;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--p);color:var(--ink);grid-area:ic}
.ev-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;grid-area:t}
.ev-t small{display:none;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.ev-t b{font-size:16px;font-weight:600;line-height:1.25}
.ev-t i{font-style:normal;font-size:13px;color:var(--mut);line-height:1.35}
.ev-d{flex:none;display:flex;flex-direction:column;align-items:flex-end;line-height:1;grid-area:d}
.ev-d b{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ev-d b.txt{font-size:15px;letter-spacing:0}
.ev-d i{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-top:5px}
.ev-d i:empty{display:none}
.stk{display:none}
.ev:active{transform:scale(.985)}
.det{padding:2px 16px 16px;display:flex;flex-direction:column;gap:10px;animation:rise .28s ease}
.det-l{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:42px;padding:0 13px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--mut)}
.chip.on{border-color:var(--fg);color:var(--fg);font-weight:600}
.det-a{display:flex;gap:8px;margin-top:4px}
.btn{flex:1;height:46px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.btn.ok{flex:none;width:46px;padding:0;display:grid;place-items:center}

.nav{position:absolute;left:14px;right:14px;bottom:14px;height:76px;border-radius:38px;background:var(--nav);border:1px solid var(--line);display:flex;align-items:center;padding:0 6px;box-shadow:0 18px 40px rgba(0,0,0,.14);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;font-size:11px;font-weight:500;color:var(--mut)}
.nav button.on{color:var(--fg);font-weight:600}
.nav .fab{flex:none;width:62px;height:62px;min-height:0;border-radius:50%;background:var(--acc);color:var(--acc-ink);margin:-22px 6px 0;box-shadow:0 12px 26px rgba(0,0,0,.28);transition:transform .2s}
.nav .fab:active{transform:scale(.92) rotate(90deg)}
.nav .fab svg{width:26px;height:26px;stroke-width:2.2}

.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:30px 30px 0 0;padding:12px 20px 22px;display:flex;flex-direction:column;gap:14px;animation:up .32s cubic-bezier(.2,.9,.3,1);max-height:92%;overflow-y:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.sheet label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--mut)}
.sheet input{height:50px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:0 14px;font:inherit;font-size:16px;font-weight:500;width:100%}
.sheet .chip.on{background:var(--fg);color:var(--bg)}
.sheet .btn{flex:none;height:52px;font-size:15px}
.toast{position:absolute;left:50%;bottom:104px;transform:translate(-50%,12px);background:var(--fg);color:var(--bg);font-size:13px;font-weight:600;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 03 Pastel: stacked sticker cards ---------- */
.v-c{--bg:#F5F1FF;--fg:#1D1836;--mut:#5C5778;--card:#FFFFFF;--line:rgba(29,24,54,.14);--acc:#1D1836;--acc-ink:#FFFFFF;--nav:#FFFFFF;--sheet:#FFFFFF;--font:'DM Sans',system-ui,sans-serif;--mono:'DM Sans',system-ui,sans-serif;--disp:'Bricolage Grotesque','DM Sans',system-ui,sans-serif}
.v-c h1{font-family:var(--disp);font-weight:800;font-size:30px;line-height:1.05;white-space:nowrap}
.v-c .sub{margin:8px 0 0;font-size:14px;color:var(--mut)}
.v-c .rb{background:#FFD46B;border:0;font-family:var(--disp);font-weight:800;font-size:18px}
.v-c .list{gap:0;padding-top:4px}
.v-c .ev{background:var(--p);border:0;border-radius:32px;color:var(--ink);margin-top:-14px;box-shadow:0 -8px 20px rgba(29,24,54,.08)}
.v-c .ev:first-child{margin-top:0}
.v-c .ev:nth-child(odd){transform:rotate(-1.4deg)}
.v-c .ev:nth-child(even){transform:rotate(1.2deg)}
.v-c .ev.open{transform:none;z-index:2;margin-bottom:26px;box-shadow:0 18px 40px rgba(29,24,54,.2)}
.v-c .ev:last-child.open{margin-bottom:0}
.v-c .ev-h{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"ic s d" "t t d";column-gap:10px;row-gap:14px;padding:18px 20px 32px;align-items:center}
.v-c .ev.open .ev-h{padding-bottom:16px}
.v-c .ev-ic{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.75);color:var(--ink)}
.v-c .ev-t small{display:block;opacity:.8}
.v-c .ev-t b{font-family:var(--disp);font-weight:800;font-size:23px;line-height:1.1;letter-spacing:-.01em}
.v-c .ev-t i{color:inherit;opacity:.8;font-size:14px}
.v-c .ev-d{align-self:center}
.v-c .ev-d b{font-family:var(--disp);font-weight:800;font-size:56px;letter-spacing:-.04em}
.v-c .ev-d b.txt{font-size:24px}
.v-c .ev-d i{font-family:var(--font);font-size:12px;letter-spacing:.04em;text-transform:none;color:inherit;opacity:.8;font-weight:600}
.v-c .ev.soon .stk{display:inline-flex;grid-area:s;justify-self:start;background:var(--ink);color:var(--p);font-style:normal;font-size:11px;font-weight:700;padding:6px 11px;border-radius:999px;animation:wig 2.4s ease-in-out infinite}
.v-c .ev.cat-concert .ev-h::before,.v-c .ev.cat-concert .ev-h::after{content:"";position:absolute;top:66px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.v-c .ev.cat-concert .ev-h::before{left:-12px}
.v-c .ev.cat-concert .ev-h::after{right:-12px}
.v-c .det-l,.v-c .chip{color:var(--ink)}
.v-c .det-l{opacity:.75;font-weight:700;letter-spacing:.08em}
.v-c .chip{border-color:color-mix(in srgb,var(--ink) 30%,transparent)}
.v-c .ev .chip.on{background:var(--ink);color:var(--p);border-color:var(--ink)}
.v-c .ev .btn{border-color:color-mix(in srgb,var(--ink) 35%,transparent)}
.v-c .ev .btn.pri{background:var(--ink);color:var(--p)}
.v-c .fl button{background:#fff;border:0;color:var(--fg);font-weight:600}
.v-c .fl button.on{background:var(--fg);color:#fff}
.v-c .nav{box-shadow:0 18px 40px rgba(29,24,54,.18);border:0}

/* ---------- sub pages: Kişiler, Takvim, Profil (shared by 05 and 03) ---------- */
.sub{margin:6px 0 0;font-size:14px;line-height:1.4;color:var(--mut)}
.act2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.act2 button{min-height:88px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:14px 16px;border-radius:24px;background:var(--card);border:1px solid var(--line);font-size:15px;font-weight:600;text-align:left}
.act2 button.pri{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.srch{position:relative}
.srch svg{position:absolute;left:15px;top:13px;color:var(--mut);pointer-events:none}
.srch input{width:100%;height:48px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:0 16px 0 46px;font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
.pr,.crow{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:22px}
.pr>svg{color:var(--mut);flex:none}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;background:var(--p);color:var(--ink)}
.av.big{width:76px;height:76px;font-size:30px}
.pr-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pr-t b{font-size:16px;font-weight:600}
.pr-t i{font-style:normal;font-size:13px;color:var(--mut)}
.tag{flex:none;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--fg);color:var(--bg)}
.pd{display:flex;align-items:center;gap:16px}
.btn.sm{flex:none;height:46px;padding:0 18px;background:var(--card)}
.btn.wide{flex:none;width:100%;height:52px;font-size:15px}
.note{display:inline-flex;align-items:center;height:38px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px}
.noteadd{display:flex;gap:8px}
.noteadd input{flex:1;min-width:0;height:48px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:0 16px;font:inherit;font-size:16px}
.noteadd .btn{flex:none;height:48px;padding:0 18px}
.cal{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:12px 10px 10px}
.cal-h{display:flex;justify-content:space-between;align-items:center;padding:0 2px 10px}
.cal-h b{font-size:18px;font-weight:700}
.cal-h .rb{background:transparent}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-w span{text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding-bottom:4px}
.cday{height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cday b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:500}
.cday.hol b{color:#B5281E;font-weight:700}
.cday.today b{box-shadow:inset 0 0 0 1.5px var(--fg)}
.cday.sel b{background:var(--acc);color:var(--acc-ink);font-weight:700;box-shadow:none}
.cday i{display:flex;gap:2px;height:5px}
.cday i u{width:5px;height:5px;border-radius:50%;background:color-mix(in srgb,var(--c) 55%,var(--ink))}
.holrow{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:18px;background:#FBE3DF;color:#7A1A12;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:4px}
.stats b{font-size:28px;line-height:1;font-weight:700;letter-spacing:-.02em}
.stats span{font-size:12px;color:var(--mut)}
.set-l{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin-bottom:-8px;padding-left:4px}
.set{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:2px 16px}
.set-r{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;font-weight:500;text-align:left}
.set-r:last-child{border-bottom:0}
.set-r.col{flex-direction:column;align-items:stretch;gap:10px;padding:14px 0}
.set-t{display:flex;flex-direction:column;gap:2px}
.set-t small{font-size:12px;font-weight:400;color:var(--mut)}
.set-r .v,.set-r>svg{color:var(--mut);font-size:14px;flex:none}
.tg{flex:none;width:50px;height:30px;border-radius:15px;background:color-mix(in srgb,var(--fg) 22%,transparent);position:relative;transition:.2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.set-r[aria-checked="true"] .tg{background:var(--acc)}
.set-r[aria-checked="true"] .tg::after{transform:translateX(20px)}
.set .chip.on{background:var(--fg);color:var(--bg)}
.seg2{display:flex;background:color-mix(in srgb,var(--fg) 8%,transparent);border-radius:999px;padding:4px}
.seg2 button{flex:1;height:44px;border-radius:999px;font-size:14px;font-weight:600;color:var(--mut)}
.seg2 button.on{background:var(--card);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.pro{background:var(--fg);color:var(--bg);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:8px}
.pro b{font-size:22px;font-weight:700}
.pro p{margin:0;font-size:14px;line-height:1.45;opacity:.85}
.pro .btn{flex:none;align-self:flex-start;margin-top:6px;background:var(--bg);color:var(--fg);border:0;padding:0 20px}
.sheet.tall{height:88%}
.clist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
.crow{flex:none;padding:10px 12px}
.crow:disabled{opacity:.5;cursor:default}
.ck{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.ck svg{width:16px;height:16px;stroke-width:3}
.crow[aria-pressed="true"]{border-color:var(--fg)}
.crow[aria-pressed="true"] .ck{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.sheet>.btn{flex:none;height:52px;font-size:15px}
.v-c .list.plain{gap:10px}
.v-c .pr,.v-c .crow,.v-c .set,.v-c .cal,.v-c .stats div,.v-c .srch input,.v-c .note,.v-c .noteadd input{border-color:transparent}
.v-c .sheet .crow,.v-c .sheet .srch input,.v-c .sheet input{background:#F5F1FF}
.v-c .pr-t b,.v-c .cal-h b,.v-c .stats b,.v-c .pro b{font-family:var(--disp);font-weight:800}
.v-c .pr-t b{font-size:18px}
.v-c .act2 button{border:0}
.v-c .act2 button:not(.pri){background:#FFD46B}
.v-c .cday.sel b{background:#FFD46B;color:var(--fg)}
.v-c .set-l{font-weight:700;letter-spacing:.08em}
.v-c .tag{background:#FFD46B;color:var(--fg)}
.v-c .hd .rb[data-act]{font-size:0}


/* ---------- Liste görünümü (opsiyonel, Profil > Görünüm) ---------- */
.v-c.lv .list{gap:10px}
.v-c.lv .ev{margin-top:0;transform:none!important;background:var(--card);color:var(--fg);border-radius:24px;box-shadow:0 1px 2px rgba(29,24,54,.05)}
.v-c.lv .ev.open{margin-bottom:0;box-shadow:0 10px 26px rgba(29,24,54,.12)}
.v-c.lv .ev-h{grid-template-columns:auto 1fr auto;grid-template-areas:"ic t d";padding:14px 16px;row-gap:0;column-gap:14px}
.v-c.lv .ev.open .ev-h{padding-bottom:14px}
.v-c.lv .ev-ic{width:48px;height:48px;border-radius:16px;background:var(--p);color:var(--ink)}
.v-c.lv .ev-t small{display:none}
.v-c.lv .ev-t b{font-size:17px}
.v-c.lv .ev-t i{font-size:13px;color:var(--mut);opacity:1}
.v-c.lv .ev-d b{font-size:30px}
.v-c.lv .ev-d b.txt{font-size:16px}
.v-c.lv .ev-d i{color:var(--mut);opacity:1}
.v-c.lv .ev.soon .stk{display:none}
.v-c.lv .ev.cat-concert .ev-h::before,.v-c.lv .ev.cat-concert .ev-h::after{display:none}
.v-c.lv .ev.soon .ev-d b{color:var(--ink)}
.set .seg2{margin-top:2px}


/* Liste görünümünde en yakın gün hero */
.lv-sep{display:none}
.v-c.lv .lv-sep{display:block;margin:10px 0 0 4px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.v-c.lv .ev.hero{background:var(--p);color:var(--ink);border-radius:32px;box-shadow:0 14px 34px rgba(29,24,54,.16)}
.v-c.lv .ev.hero .ev-h{grid-template-areas:"ic s d" "t t d";row-gap:14px;column-gap:10px;padding:20px 22px 22px}
.v-c.lv .ev.hero .ev-ic{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.75)}
.v-c.lv .ev.hero .ev-t small{display:block;opacity:.8}
.v-c.lv .ev.hero .ev-t b{font-family:var(--disp);font-weight:800;font-size:24px;line-height:1.1}
.v-c.lv .ev.hero .ev-t i{color:inherit;opacity:.8;font-size:14px}

(function migrateOld(){
  try{
    if(localStorage.getItem('kalender.p.migrated'))return;
    var oe=JSON.parse(localStorage.getItem('onemliGunler.v1')||'[]');
    var of=JSON.parse(localStorage.getItem('kalender.aile.v1')||'[]');

    events=events.filter(function(e){return e.id>12;});

    var today=mid(new Date());
    function d0(iso){var a=iso.split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
    function nextOcc(iso){var o=d0(iso),n=new Date(today.getFullYear(),o.getMonth(),o.getDate());if(n<today)n.setFullYear(n.getFullYear()+1);return n;}
    var CMAP={dogum:'bday',yildonumu:'anniv',dugun:'wedding',konser:'concert',standup:'concert',tiyatro:'concert',sinema:'concert',mac:'concert',egitim:'edu',doktor:'doctor',saglik:'doctor',fizik:'doctor',ilac:'doctor',veteriner:'doctor'};
    // aile üyeleri -> kişiler (+ doğum günü)
    var pmap={};
    of.forEach(function(m){
      if(!m||!m.name)return;
      if(m.relation==='kendi')return;
      var np={id:pid++,name:m.name,group:'Aile',notes:[]};
      people.push(np);pmap[m.name.toLocaleLowerCase('tr')]=np.id;
      if(m.birthday){
        var has=oe.some(function(e){return e.category==='dogum'&&e.title&&e.title.toLocaleLowerCase('tr').indexOf(m.name.toLocaleLowerCase('tr'))>=0;});
        if(!has)events.push({id:eid++,cat:'bday',title:m.name+' doğum günü',note:'',when:nextOcc(m.birthday),allDay:true,persons:[np.id]});
      }
    });
    // günler
    oe.forEach(function(e){
      if(!e||!e.title||!e.date)return;
      var cat=CMAP[e.category]||'task',orig=d0(e.date),rec=!!e.recurring;
      var when=rec?nextOcc(e.date):orig,past=!rec&&orig<today;
      var note=[e.note,e.spending].filter(Boolean).join(' · ');
      var persons=[];var lt=e.title.toLocaleLowerCase('tr');
      for(var nm in pmap)if(lt.indexOf(nm)>=0)persons.push(pmap[nm]);
      var ne={id:eid++,cat:cat,title:e.title,note:note,when:when,allDay:true,persons:persons};
      if(past){ne.done=true;ne.doneAt=+orig;}
      events.push(ne);
    });
    localStorage.setItem('kalender.p.migrated','1');
    localStorage.setItem('kalender.p.events',JSON.stringify(events));
    localStorage.setItem('kalender.p.people',JSON.stringify(people));
  }catch(err){}
})();

  var list=people.filter(function(p){return state.pgroup==='all'||p.group===state.pgroup;});
  return '<header class="hd"><div><div class="eyebrow">'+people.length+' kişi</div><h1>Kişiler</h1></div></header>'+
    '<div class="act2"><button class="pri" data-act="sheet" data-s="person">'+ICON.plus+'<span>Kişi ekle</span></button><button data-act="sheet" data-s="contacts">'+ICON.users+'<span>Rehberden seç</span></button></div>'+
    '<div class="srch">'+ICON.search+'<input id="pSearch" type="search" placeholder="Kişilerde ara" aria-label="Kişilerde ara"></div>'+
    '<div class="fl x" role="group" aria-label="Grup">'+['all'].concat(GROUPS).map(function(g){return '<button data-act="pgroup" data-g="'+g+'" class="'+(state.pgroup===g?'on':'')+'" aria-pressed="'+(state.pgroup===g)+'">'+(g==='all'?'Tümü':g)+'</button>';}).join('')+'</div>'+
    '<div class="list plain" id="plist">'+(list.length?list.map(function(p){
      var es=pEvents(p.id),n=es[0];
      return '<button class="pr" data-act="person" data-id="'+p.id+'" data-n="'+esc(low(p.name))+'">'+av(p)+'<span class="pr-t"><b>'+esc(p.name)+'</b><i>'+p.group+' · '+(n?CATS[n.cat].l+', '+(dayDiff(n)<=0?'bugün':dayDiff(n)+' gün sonra'):'gün eklenmedi')+'</i></span>'+(n&&dayDiff(n)<=7?'<span class="tag">Yakında</span>':'')+ICON.cr+'</button>';
    }).join(''):'<p class="empty">Bu grupta kimse yok.</p>')+'</div>';
},
person:function(){
  var p=pOf(state.person),es=pEvents(p.id);
  return '<div class="hd"><button class="rb" data-act="back" aria-label="Kişilere dön">'+ICON.cl+'</button><button class="btn sm" data-act="demo">Düzenle</button></div>'+
    '<div class="pd">'+av(p,true)+'<div><h1>'+esc(p.name)+'</h1><p class="sub">'+p.group+' · '+es.length+' gün kayıtlı</p></div></div>'+
    '<h2>Günleri</h2><div class="list">'+(es.length?es.map(ev).join(''):'<p class="empty">Henüz gün yok. Doğum günüyle başlayabilirsin.</p>')+'</div>'+
    '<button class="btn pri wide" data-act="add">'+esc(p.name)+' için gün ekle</button>'+
    '<h2>Hediye notları</h2>'+(p.notes.length?'<div class="chips">'+p.notes.map(function(n){return '<span class="note">'+esc(n)+'</span>';}).join('')+'</div>':'')+
    '<form class="noteadd" id="noteForm" autocomplete="off"><input id="fNote" type="text" placeholder="Aklına gelen bir fikir yaz" aria-label="Hediye notu" maxlength="40"><button type="submit" class="btn pri">Ekle</button></form>';
},
cal:function(){
  var y=state.calY,m=state.calM,lead=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),today=+mid(new Date()),all=sorted(),cells='',i,d;
  for(i=0;i<lead;i++)cells+='<span></span>';
  for(d=1;d<=dim;d++){
    var dt=+new Date(y,m,d),evs=all.filter(function(e){return +mid(e.when)===dt;}),hol=state.set.hol&&HOL[(m+1)+'-'+d];
    cells+='<button class="cday'+(dt===today?' today':'')+(dt===+state.sel?' sel':'')+(hol?' hol':'')+'" data-act="day" data-d="'+d+'" aria-label="'+d+' '+MON[m]+(evs.length?', '+evs.length+' kayıt':'')+(hol?', resmi tatil':'')+'"><b>'+d+'</b><i>'+evs.slice(0,3).map(function(e){return '<u style="--c:'+CATS[e.cat].c+';--ink:'+CATS[e.cat].ink+'"></u>';}).join('')+'</i></button>';
  }
  var inM=all.filter(function(e){return e.when.getFullYear()===y&&e.when.getMonth()===m;}),s=state.sel;
  var sevs=all.filter(function(e){return +mid(e.when)===+s;}),sh=state.set.hol&&HOL[(s.getMonth()+1)+'-'+s.getDate()];
  return '<header class="hd"><div><div class="eyebrow">'+(inM.length?inM.length+' kayıt bu ay':'Bu ay boş')+'</div><h1>Takvim</h1></div></header>'+
    '<section class="cal"><div class="cal-h"><button class="rb" data-act="mon" data-n="-1" aria-label="Önceki ay">'+ICON.cl+'</button><b>'+MON[m]+' '+y+'</b><button class="rb" data-act="mon" data-n="1" aria-label="Sonraki ay">'+ICON.cr+'</button></div>'+
    '<div class="cal-w">'+['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(function(w){return '<span>'+w+'</span>';}).join('')+'</div><div class="cal-g">'+cells+'</div></section>'+
    '<h2>'+s.getDate()+' '+MON[s.getMonth()]+' '+WD[s.getDay()]+'</h2>'+
    (sh?'<div class="holrow"><b>Resmi tatil</b><span>'+sh+'</span></div>':'')+
    '<div class="list">'+(sevs.length?sevs.map(ev).join(''):'<p class="empty">Bu gün boş.</p>')+'</div>'+
    '<button class="btn wide" data-act="add">Bu güne ekle</button>';
},
me:function(){
  var all=sorted(),month=all.filter(function(e){return dayDiff(e)<=30;}).length;
  return '<header class="pd">'+'<span class="av big" style="--p:#FFD46B;--ink:#3B2A00">M</span><div><h1>Mustafa</h1><p class="sub">Profil ve ayarlar</p></div></header>'+
    '<div class="stats"><div><b>'+all.length+'</b><span>gün</span></div><div><b>'+people.length+'</b><span>kişi</span></div><div><b>'+month+'</b><span>30 gün içinde</span></div></div>'+
    '<div class="set-l">Hatırlatmalar</div><section class="set">'+
      '<button class="set-r" data-act="demo"><span class="set-t">Bildirim saati</span><span class="v">09:00</span></button>'+
      '<div class="set-r col"><span class="set-t">Yeni günlerde varsayılan plan</span><div class="chips">'+[['w','1 hafta önce'],['d','1 gün önce'],['o','O gün']].map(function(c){return '<button class="chip'+(state.set[c[0]]?' on':'')+'" data-act="tg" data-k="'+c[0]+'" aria-pressed="'+!!state.set[c[0]]+'">'+c[1]+'</button>';}).join('')+'</div></div>'+
      sw('quiet','Sessiz saatler','23:00 ile 08:00 arası bildirim gelmez')+'</section>'+
    '<div class="set-l">Görünüm</div><section class="set">'+
      '<div class="set-r col"><span class="set-t">Gün görünümü<small>Liste, çok günün olduğunda daha kolay taranır</small></span><div class="seg2" role="group" aria-label="Gün görünümü">'+[['cards','Kartlar'],['list','Liste']].map(function(o){var on=state.set.view===o[0];return '<button class="'+(on?'on':'')+'" data-act="view" data-v="'+o[0]+'" aria-pressed="'+on+'">'+o[1]+'</button>';}).join('')+'</div></div>'+
      sw('hol','Resmi tatilleri takvimde göster')+'</section>'+
    '<div class="set-l">Veriler</div><section class="set">'+sw('contacts','Rehber erişimi','Yalnızca seçtiğin kişiler eklenir')+
      '<button class="set-r" data-act="demo"><span class="set-t">Yedekle ve geri yükle</span>'+ICON.cr+'</button></section>'+
    '<section class="pro"><b>Pro</b><p>Tek seferlik ödeme. Veri toplamaz, çevrimdışı çalışır.</p><button class="btn" data-act="demo">Pro&#39;yu incele</button></section>';
}};

function nav(){
  var T=[['home','Ana Sayfa',ICON.home],['people','Kişiler',ICON.users],0,['cal','Takvim',ICON.cal],['me','Profil',ICON.user]];
  return '<nav class="nav" aria-label="Ana menü">'+T.map(function(t){
    if(!t)return '<button class="fab" data-act="add" aria-label="Yeni gün ekle">'+ICON.plus+'</button>';
    var on=state.tab===t[0];
    return '<button class="'+(on?'on':'')+'" data-act="tab" data-t="'+t[0]+'"'+(on?' aria-current="page"':'')+'>'+t[2]+'<span>'+t[1]+'</span></button>';
  }).join('')+'</nav>';
}
function sheetHead(t){return '<span class="grab"></span><div class="sheet-h"><h2>'+t+'</h2><button type="button" class="rb" data-act="close" aria-label="Kapat">'+ICON.x+'</button></div>';}
var SHEETS={
event:function(){
  var p=state.person&&pOf(state.person),d=state.tab==='cal'&&!p&&state.sel>=mid(new Date())?state.sel:at(7,0,0);
  return '<div class="sheet-bg" data-act="close"></div><form class="sheet" id="addForm" autocomplete="off">'+sheetHead(p?esc(p.name)+' için gün ekle':'Yeni gün ekle')+
    '<div class="chips" id="catChips">'+Object.keys(CATS).map(function(k){return '<button type="button" class="chip'+(state.newCat===k?' on':'')+'" data-act="cat" data-c="'+k+'" aria-pressed="'+(state.newCat===k)+'">'+CATS[k].l+'</button>';}).join('')+'</div>'+
    '<label for="fTitle">Başlık<input id="fTitle" name="title" type="text" placeholder="Örn. Konser, düğün, randevu" maxlength="40"></label>'+
    '<label for="fDate">Tarih<input id="fDate" name="date" type="date" value="'+iso(d)+'"></label>'+
    '<button type="submit" class="btn pri">Ekle</button></form>';
},
person:function(){
  return '<div class="sheet-bg" data-act="close"></div><form class="sheet" id="personForm" autocomplete="off">'+sheetHead('Kişi ekle')+
    '<label for="fName">Ad<input id="fName" type="text" placeholder="Örn. Ayşe teyze" maxlength="30"></label>'+
    '<div class="chips" id="grpChips">'+GROUPS.map(function(g){return '<button type="button" class="chip'+(state.newGrp===g?' on':'')+'" data-act="grp" data-g="'+g+'" aria-pressed="'+(state.newGrp===g)+'">'+g+'</button>';}).join('')+'</div>'+
    '<label for="fBday">Doğum günü (isteğe bağlı)<input id="fBday" type="date"></label>'+
    '<button type="submit" class="btn pri">Kişiyi ekle</button>'+
    '<button type="button" class="btn" data-act="sheet" data-s="contacts">Rehberden seç</button></form>';
},
contacts:function(){
  var have=people.map(function(p){return p.name;});
  return '<div class="sheet-bg" data-act="close"></div><div class="sheet tall">'+sheetHead('Rehberden seç')+
    '<p class="sub">Örnek rehber. Uygulamada telefonundaki kişiler listelenir, yalnızca işaretlediklerin eklenir.</p>'+
    '<div class="srch">'+ICON.search+'<input id="cSearch" type="search" placeholder="Rehberde ara" aria-label="Rehberde ara"></div>'+
    '<div class="clist" id="clist">'+CONTACTS.map(function(n,i){
      var done=have.indexOf(n)>=0;
      return '<button class="crow" data-act="pick" data-i="'+i+'" data-n="'+esc(low(n))+'" aria-pressed="false"'+(done?' disabled':'')+'>'+av({id:i+1,name:n})+'<span class="pr-t"><b>'+n+'</b>'+(done?'<i>Zaten ekli</i>':'')+'</span><span class="ck">'+ICON.check+'</span></button>';
    }).join('')+'</div>'+
    '<button class="btn pri" id="impBtn" data-act="import">Kişi seç</button></div>';
}};

function render(keep){
  persist();
  var sc=phone.querySelector('.scroll'),st=keep&&sc?sc.scrollTop:0;
  var all=sorted(),list=all.filter(function(e){return state.filter==='all'||CATS[e.cat].g===state.filter;});
  phone.className='phone v-c'+(state.set.view==='list'?' lv':'');
  var body=state.person?P.person():state.tab==='home'?R[state.v](all,list):P[state.tab]();
  phone.innerHTML='<div class="scroll">'+body+'</div>'+nav()+(state.sheet?SHEETS[state.sheet]():'')+'<div class="toast" id="toast" role="status"></div>';
  phone.querySelector('.scroll').scrollTop=st;
  tick();
}
function tick(){
  var els=phone.querySelectorAll('[data-cd]');
  for(var i=0;i<els.length;i++){
    var e=byId(els[i].dataset.cd);if(!e)continue;var p=parts(e);
    els[i].textContent=(p.d?p.d+' g ':'')+p2(p.h)+' sa '+p2(p.m)+' dk '+p2(p.s)+' sn';
  }
}
var toastT;
function toast(msg){var t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},1800);}
function press(wrapId,b){var cs=document.getElementById(wrapId).children;for(var i=0;i<cs.length;i++){var on=cs[i]===b;cs[i].classList.toggle('on',on);cs[i].setAttribute('aria-pressed',on);}}
function pickCount(){var n=0;for(var k in state.pick)if(state.pick[k])n++;return n;}

phone.addEventListener('click',function(ev0){
  var b=ev0.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='open'){state.open=state.open===+b.dataset.id?null:+b.dataset.id;render(true);}
  else if(a==='filter'){state.filter=b.dataset.f;state.open=null;render(true);}
  else if(a==='tab'){state.tab=b.dataset.t;state.person=null;state.open=null;state.sheet=false;render(false);}
  else if(a==='person'){state.person=+b.dataset.id;state.open=null;render(false);}
  else if(a==='back'){state.person=null;state.open=null;render(false);}
  else if(a==='pgroup'){state.pgroup=b.dataset.g;render(true);}
  else if(a==='add'){state.sheet='event';render(true);var f=document.getElementById('fTitle');if(f)f.focus();}
  else if(a==='sheet'){state.sheet=b.dataset.s;state.pick={};render(true);var f2=document.getElementById('fName');if(f2)f2.focus();}
  else if(a==='close'){state.sheet=false;render(true);}
  else if(a==='cat'){state.newCat=b.dataset.c;press('catChips',b);}
  else if(a==='grp'){state.newGrp=b.dataset.g;press('grpChips',b);}
  else if(a==='chip'){var on2=b.classList.toggle('on');b.setAttribute('aria-pressed',on2);}
  else if(a==='pick'){var i=b.dataset.i;state.pick[i]=!state.pick[i];b.setAttribute('aria-pressed',!!state.pick[i]);var n=pickCount();document.getElementById('impBtn').textContent=n?n+' kişiyi ekle':'Kişi seç';}
  else if(a==='import'){
    var n2=pickCount();if(!n2){toast('Önce listeden kişi işaretle');return;}
    for(var k in state.pick)if(state.pick[k])people.push({id:nextP++,name:CONTACTS[k],group:'Arkadaş',notes:[]});
    state.sheet=false;state.pgroup='all';state.tab='people';state.person=null;render(false);toast(n2+' kişi eklendi');
  }
  else if(a==='day'){state.sel=new Date(state.calY,state.calM,+b.dataset.d);state.open=null;render(true);}
  else if(a==='mon'){var d=new Date(state.calY,state.calM+(+b.dataset.n),1);state.calY=d.getFullYear();state.calM=d.getMonth();render(true);}
  else if(a==='view'){state.set.view=b.dataset.v;try{localStorage.setItem('kalender.view',state.set.view);}catch(e){}render(true);toast(state.set.view==='list'?'Liste görünümü açık':'Kart görünümü açık');}
  else if(a==='tg'){state.set[b.dataset.k]=!state.set[b.dataset.k];render(true);}
  else if(a==='done'){var de=byId(b.dataset.id);de.done=true;de.doneAt=Date.now();state.open=null;render(true);toast('Tamamlandı, en alta taşındı');}
  else if(a==='undo'){var ue=byId(b.dataset.id);ue.done=false;state.open=null;render(true);toast('Geri alındı');}
  else if(a==='del'){var did=+b.dataset.id;events=events.filter(function(e){return e.id!==did;});state.open=null;render(true);toast('Silindi');}
  else if(a==='doneToggle'){state.doneOpen=!state.doneOpen;render(true);}
  else if(a==='demo'){toast('Bu adım demoda yok');}
});
phone.addEventListener('input',function(e){
  var id=e.target.id,wrap=id==='pSearch'?'plist':id==='cSearch'?'clist':null;if(!wrap)return;
  var q=low(e.target.value.trim()),rows=document.getElementById(wrap).children;
  for(var i=0;i<rows.length;i++)if(rows[i].dataset.n!==undefined)rows[i].style.display=rows[i].dataset.n.indexOf(q)>=0?'':'none';
});
phone.addEventListener('submit',function(e){
  e.preventDefault();
  var fid=e.target.id;
  if(fid==='addForm'){
    var t=document.getElementById('fTitle'),d=document.getElementById('fDate');
    if(!t.value.trim()){t.focus();toast('Önce bir başlık yaz');return;}
    var when=d.value?new Date(d.value+'T00:00:00'):at(7,0,0);
    if(isNaN(when)||when<mid(new Date())){d.focus();toast('Bugün ya da sonrası bir tarih seç');return;}
    var id=nextId++;
    events.push({id:id,cat:state.newCat,title:t.value.trim(),note:'',when:when,allDay:true,persons:state.person?[state.person]:[]});
    state.sheet=false;state.filter='all';state.open=id;
    if(state.tab==='cal'&&!state.person){state.sel=mid(when);state.calY=when.getFullYear();state.calM=when.getMonth();}
    render(true);toast('Eklendi');
  }else if(fid==='personForm'){
    var nm=document.getElementById('fName'),bd=document.getElementById('fBday');
    if(!nm.value.trim()){nm.focus();toast('Önce bir ad yaz');return;}
    var p={id:nextP++,name:nm.value.trim(),group:state.newGrp,notes:[]};people.push(p);
    if(bd.value){
      var src=new Date(bd.value+'T00:00:00'),now=mid(new Date()),nx=new Date(now.getFullYear(),src.getMonth(),src.getDate());
      if(nx<now)nx.setFullYear(nx.getFullYear()+1);
      events.push({id:nextId++,cat:'bday',title:p.name+' doğum günü',note:'',when:nx,allDay:true,persons:[p.id]});
    }
    state.sheet=false;state.tab='people';state.person=p.id;render(false);toast('Kişi eklendi');
  }else if(fid==='noteForm'){
    var nt=document.getElementById('fNote');if(!nt.value.trim()){nt.focus();return;}
    pOf(state.person).notes.push(nt.value.trim());render(true);toast('Not eklendi');
  }
});
render(false);
setInterval(tick,1000);
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('service-worker.js').catch(function(){});});}
})();
</script>
</body>
</html>
